<style>

<script>
const W=1080,H=1920,NW=180,NH=320;
const main=document.getElementById('c'),M0=main.getContext('2d');
const native=document.createElement('canvas');native.width=NW;native.height=NH;
const nctx=native.getContext('2d',{willReadFrequently:true});
const img=nctx.createImageData(NW,NH),data=img.data;
const N=NW*NH;
const sceneBuf=new Uint8Array(N),bufA=new Uint8Array(N),bufB=new Uint8Array(N),UI=new Uint8Array(N);
let IDX=sceneBuf,MODE=0,camX=0,camY=0;
const FONT='"Fusion Pixel 12px Mono zh-Hans","Fusion Pixel 12px Mono latin","WenQuanYi Micro Hei Mono",monospace';
const LINES=['床前明月光','疑是地上霜','举头望明月','低头思故乡'];
const CLIPS=/*CLIPS*/[{"id":"c0","text":"公元七二六年，深秋。扬州城外的一间旅舍里，二十六岁的李白，独在异乡，夜不能寐。","dur":7.776},{"id":"p1","text":"床前明月光。","dur":2.445},{"id":"n1","text":"月光穿过窗棂，悄无声息地，铺满了床前。","dur":4.704},{"id":"p2","text":"疑是地上霜。","dur":1.834},{"id":"n2","text":"那一片清辉，白得发冷。恍惚之间，他竟以为，是地上结了一层秋霜。","dur":6.553},{"id":"p3","text":"举头望明月。","dur":2.032},{"id":"n3","text":"他抬起头。一轮明月，高悬天际。千里之外的故乡，此刻，也被这同一轮月光照着。","dur":8.453},{"id":"p4","text":"低头思故乡。","dur":1.901},{"id":"n4","text":"低下头，思绪便飞回了故乡。那里的炊烟，那里的灯火，还有那些，等他回家的人。","dur":7.765},{"id":"p5","text":"床前明月光，疑是地上霜。举头望明月，低头思故乡。","dur":8.653},{"id":"n5","text":"二十个字，一轮明月，照亮了一千三百年的乡愁。","dur":5.189}]/*END*/;
const C=Object.fromEntries(CLIPS.map(c=>[c.id,c]));
const LEAD=[0,0.6,0.6,1.8,3.6],TR=1.8;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ss=(a,b,t)=>{t=cl((t-a)/(b-a));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-(1-cl(t))**3;
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const dith=(x,y,t)=>BAYER[(((y%4)+4)%4)*4+(((x%4)+4)%4)]/16<t;
const TL=(()=>{const S=[{start:0}],cues=[{id:'c0',t:2.8}];let end=2.8+C.c0.dur+1.4;S[0].end=end;
  for(let k=1;k<=4;k++){const st=end-TR,pt=st+TR+LEAD[k];cues.push({id:'p'+k,t:pt});const nt=pt+C['p'+k].dur+0.6;cues.push({id:'n'+k,t:nt});end=nt+C['n'+k].dur+1.6;S.push({start:st,end})}
  const st=end-TR,p5=st+TR+2.6;cues.push({id:'p5',t:p5});const n5=p5+C.p5.dur+1.2;cues.push({id:'n5',t:n5});end=n5+C.n5.dur+4;S.push({start:st,end});
  return{S,cues,DUR:end,at:id=>cues.find(c=>c.id===id).t}})();

const PAL=[
  [16,14,28],[22,28,58],[32,44,86],[48,72,120],[82,112,158],[140,164,190],[198,214,228],[244,240,228],
  [242,226,160],[214,176,96],[168,112,72],[106,64,48],[58,40,36],[232,136,58],[244,196,90],[143,208,232],
  [216,244,255],[232,184,152],[184,120,96],[90,48,104],[138,86,156],[186,140,196],[36,64,48],[62,110,64],
  [208,64,72],[232,214,186],[8,8,14],[255,250,240],[90,180,186],[28,42,36],[230,150,150],[255,208,160]
];
const DARK=new Uint8Array([0,0,1,2,3,4,5,6,9,11,11,12,0,9,13,5,15,18,12,19,19,20,29,22,12,5,0,7,3,0,18,9]);
const IDN=Uint8Array.from({length:32},(_,i)=>i);
function remap(pairs){const l=new Uint8Array(IDN);for(const[a,b]of pairs)l[a]=b;l[8]=8;l[19]=19;return l}
const LUTS=[
  IDN,
  remap([[9,6],[10,4],[11,3],[12,1],[13,15],[14,16],[24,5],[25,6],[31,16]]),
  remap([[1,12],[2,11],[3,10],[4,13],[6,31],[15,14],[16,31],[28,13]])
];
function fadeLut(base,level){const o=new Uint8Array(32);for(let i=0;i<32;i++){let c=base[i];for(let k=0;k<level;k++)c=DARK[c];o[i]=c}o[8]=8;o[19]=19;return o}
function fadeLevel(t){if(t<1.6)return 3-Math.min(3,(t/1.6*4)|0);if(t>TL.DUR-2.4)return Math.min(3,((t-(TL.DUR-2.4))/2.4*4)|0);return 0}

function pix(x,y,c){if(MODE===0){x+=camX;y+=camY}x|=0;y|=0;if(x<0||y<0||x>=NW||y>=NH||c<0)return;if(MODE)UI[y*NW+x]=c;else IDX[y*NW+x]=c}
function rect(x,y,w,h,c){x|=0;y|=0;w|=0;h|=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++)pix(x+i,y+j,c)}
function clearScene(i=1){IDX.fill(i)}
function use(buf,fn){const p=IDX;IDX=buf;fn();IDX=p}

const gcache=new Map();
const scratch=document.createElement('canvas');scratch.width=20;scratch.height=20;
const sctx=scratch.getContext('2d',{willReadFrequently:true});
function raster(ch){
  const hit=gcache.get(ch);if(hit)return hit;
  sctx.clearRect(0,0,20,20);sctx.fillStyle='#000';sctx.fillRect(0,0,20,20);
  sctx.font=`12px ${FONT}`;sctx.textBaseline='top';sctx.fillStyle='#fff';sctx.fillText(ch,2,2);
  const im=sctx.getImageData(0,0,20,20).data,pxs=[];
  let max=0;for(let j=0;j<20;j++)for(let i=0;i<20;i++){const a=im[(j*20+i)*4];if(a>128){pxs.push(i-2,j-2);if(i-2>max)max=i-2}}
  const adv=Math.max(6,Math.min(12,Math.round(sctx.measureText(ch).width)||12));
  const g={pxs,adv:pxs.length?Math.max(adv,max+1):adv};gcache.set(ch,g);return g
}
function glyphText(str,x,y,scale,col,shadow){
  let cx=x|0;const sc=scale|0;
  for(const ch of str){const g=raster(ch);
    const draw=(ox,oy,c)=>{const p=g.pxs;for(let i=0;i<p.length;i+=2){const gx=p[i],gy=p[i+1];for(let sy=0;sy<sc;sy++)for(let sx=0;sx<sc;sx++)pix(cx+ox+gx*sc+sx,y+oy+gy*sc+sy,c)}};
    if(shadow!=null)draw(sc,sc,shadow);draw(0,0,col);cx+=g.adv*sc+(sc>1?sc:1)}
  return cx
}
function textW(str,scale=1){let w=0;for(const ch of str)w+=raster(ch).adv*scale+(scale>1?scale:1);return w}
function wrap(str,maxW){const lines=[];let line='',w=0;for(const ch of str){const a=raster(ch).adv+1;if(line&&w+a>maxW){if('，。、'.includes(ch)){line+=ch;lines.push(line);line='';w=0;continue}lines.push(line);line=ch;w=a}else{line+=ch;w+=a}}if(line)lines.push(line);return lines}

function windowBox(x,y,w,h){
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const c=(i+j<2)||(i+h-1-j<2)||(w-1-i+j<2)||(w-1-i+h-1-j<2);if(!c)pix(x+i,y+j,0)}
  for(let j=1;j<h-1;j++)for(let i=1;i<w-1;i++)pix(x+i,y+j,7);
  for(let j=2;j<h-2;j++)for(let i=2;i<w-2;i++)pix(x+i,y+j,5);
  for(let j=4;j<h-4;j++)for(let i=4;i<w-4;i++)pix(x+i,y+j,dith(x+i,y+j,0.42)?1:2);
}
function hand(x,y){const rows=['#.','##','.#.','#..#','#.#','##','#','#'];rows.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='#')pix(x+i,y+j,7);else if(ch==='.')pix(x+i,y+j,0)}))}
function caret(x,y,c){pix(x,y,c);pix(x+1,y,c);pix(x+2,y,c);pix(x+3,y,c);pix(x+4,y,c);pix(x+1,y+1,c);pix(x+2,y+1,c);pix(x+3,y+1,c);pix(x+2,y+2,c)}

const COL={o:0,k:26,s:17,a:18,e:26,r:19,m:20,h:21,b:9,f:5,g:8,n:24,w:7};

};
function parseArt(s){const rows=s.trim().split('\n').map(r=>r.replace(/\s/g,''));const w=Math.max(...rows.map(r=>r.length));return rows.map(r=>r.padEnd(w,'.'))}
const SPR=Object.fromEntries(Object.entries(ART).map(([k,v])=>[k,parseArt(v)]));
function stamp(x,y,rows,flip,scale=1){const sc=scale|0||1,h=rows.length,w=rows[0].length;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][flip?w-1-i:i];if(ch==='.')continue;const c=COL[ch];if(c==null)continue;for(let sy=0;sy<sc;sy++)for(let sx=0;sx<sc;sx++)pix((x|0)+i*sc+sx,(y|0)+j*sc+sy,c)}}
function hero(x,y,pose,t,flip){const fr=Math.floor(t*8);const breath=(pose==='stand'||pose==='back'||pose==='up')&&((fr>>2)%2===0)?-2:0;const key=pose==='walk'&&(fr%4===1||fr%4===2)?'walk':pose==='sit'?'sit':pose==='down'||pose==='kneel'?'down':pose==='up'?'up':pose==='back'?'back':'stand';stamp(x,y+breath,SPR[key],flip,2)}
const NPC=parseArt(`
...kk...
..kssk..
..kekk..
...rr...

function npc(x,y,t){stamp(x,y,NPC,false,2);const flick=Math.floor(t*12)%3===0?14:13;rect(x+16,y+12,2,8,11);rect(x+12,y+20,10,12,flick);pix(x+15,y+24,14);pix(x+16,y+24,7)}

const stars=Array.from({length:48},(_,i)=>{const r=rng(i+9);return{x:(r()*NW)|0,y:(r()*110)|0,p:(r()*8)|0}});
function sky(y0,y1){for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,y1-y0);for(let x=0;x<NW;x++)pix(x,y,dith(x,y,t>0.72?0.75:t*0.85)?(t>0.72?4:2):1)}}
function starfield(t,yMax,shift=0){const f=Math.floor(t*8);for(const s of stars){const y=s.y+shift;if(y>yMax)continue;if(((f+s.p)&7)===0)continue;pix(s.x,y,7)}}
function moon(cx,cy,r){for(let y=-r-4;y<=r+4;y++)for(let x=-r-4;x<=r+4;x++){const d=Math.hypot(x,y);if(d<=r){const crater=hash(cx+x,cy+y,4)>0.86&&d<r-2;pix(cx+x,cy+y,crater?9:8)}else if(d<r+4&&dith(cx+x,cy+y,(1-(d-r)/4)*0.7))pix(cx+x,cy+y,6)}}
function ground(y0,a,b){for(let y=y0;y<NH;y++)for(let x=0;x<NW;x++){const line=(y-y0)%7===0;const spec=hash(x,y,2)>0.9;pix(x,y,line?b:(spec?a:b))}}
function tree(x,y){rect(x,y-14,3,14,11);for(let k=0;k<3;k++){const w=14-k*2,h=7;for(let j=0;j<h;j++){const ww=Math.max(2,w-j);rect(x+1-(ww>>1),y-16-k*5+j,ww,1,k%2?23:22)}}}
function hill(y,col,amp,seed){for(let x=0;x<NW;x++){const h=amp+((Math.sin(x*0.07+seed)*amp*0.6+Math.sin(x*0.02)*3)|0);for(let yy=y-h;yy<y;yy++)if(yy>=0)pix(x,yy,col)}}
function building(x,gy,t){const w=64,wallH=54,roofH=14,top=gy-wallH-roofH;
  for(let i=0;i<roofH;i++){const inset=(roofH-i)>>1;rect(x-8+inset,top+i,w+16-inset*2,1,i<4?24:11)}
  rect(x,gy-wallH,w,wallH,10);rect(x+w-5,gy-wallH,5,wallH,11);
  const dx=x+24,dy=gy-36;rect(dx-2,dy-2,20,38,11);rect(dx,dy,16,36,12);
  rect(dx+2,dy+3,12,11,10);rect(dx+2,dy+17,12,11,10);
  pix(dx+3,dy+5,9);pix(dx+12,dy+5,9);pix(dx+3,dy+19,9);pix(dx+12,dy+19,9);
  rect(x+w-22,gy-wallH+8,16,16,11);glyphText('舍',x+w-20,gy-wallH+10,1,8,0);
  const flick=Math.floor(t*12)%3===0?14:13;rect(x+8,gy-wallH-6,2,8,11);rect(x+4,gy-wallH+2,10,12,flick);pix(x+7,gy-wallH+6,7);pix(x+8,gy-wallH+6,14);
}
function stones(){for(let x=0;x<128;x++){const y=214+((x>>3)&1);if(((x+y)&1)===0)pix(x,y,5);pix(x,216,29)}}

function drawInn(t,mode){
  sky(0,210);moon(124,34,13);starfield(t,120);hill(176,2,10,1);hill(190,1,8,2);
  tree(12,208);tree(156,204);ground(206,22,29);stones();building(100,232,t);
  if(mode==='walk'){const lt=t-TL.S[0].start;const p=cl((lt-3.05)/4.2);hero(Math.round(lerp(8,62,p)),200,p<0.98?'walk':'stand',t,false)}
  else if(mode==='back')hero(78,198,'back',t,false);
}
function drawTitle(t){sky(0,292);rect(0,292,NW,NH-292,29);moon(90,52,20);starfield(t,140);hill(250,2,16,0.4);hill(268,1,12,1.2);
  const title='静夜思';title.split('').forEach((ch,i)=>glyphText(ch,66,96+i*30,2,7,0));
  const sub='唐·李白',sw=textW(sub,1);glyphText(sub,((NW-sw)/2)|0,214,1,8,0);
  if((Math.floor(t*2)&1)===0){hand(46,248);glyphText('开始',64,246,1,6,0)}}

function lattice(x,y,w,h,withMoon){
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const t=j/h;pix(x+i,y+j,dith(i,j,t)?2:1)}
  if(withMoon)moon(x+w-18,y+16,10);
  for(let i=0;i<=w;i+=12)rect(x+i,y,2,h,12);
  for(let j=0;j<=h;j+=12)rect(x,y+j,w,2,12);
  rect(x-3,y-3,w+6,3,10);rect(x-3,y+h,w+6,3,10);rect(x-3,y-3,3,h+6,10);rect(x+w,y-3,3,h+6,10);
}
function bed(x,y){rect(x-4,y-16,6,42,11);rect(x-4,y-16,22,5,11);rect(x,y,58,28,12);rect(x+3,y+4,52,14,6);rect(x+5,y+5,16,8,7);rect(x+24,y+7,28,8,5);rect(x,y+24,58,4,0);rect(x+56,y,4,28,11)}
function shaft(x0,y0,x1,y1,col){for(let y=y0;y<y1;y++){const u=(y-y0)/(y1-y0);const L=lerp(x0,x0-2,u),R=lerp(x1,x1+14,u);for(let x=L|0;x<(R|0);x++){const edge=x<L+3||x>R-4;if(edge?dith(x,y,0.18):dith(x,y,0.38))pix(x,y,col)}}}
const dust=Array.from({length:14},(_,i)=>({x:24+(i*7)%62,p:i*13,s:8+i%5}));
function room(t,lt,frost,heroMode,withMoon){
  sky(-170,36);starfield(t,20,-120);
  rect(0,24,NW,156,1);rect(0,24,NW,3,12);
  lattice(14,40,78,56,withMoon);
  for(let y=168;y<NH;y++)for(let x=0;x<NW;x++){const plank=((y>>3)&1)===0&&((x+y*3)&15)<2;pix(x,y,plank?12:11)}
  shaft(24,168,72,232,frost>0.2?16:6);
  if(frost>0){for(let y=188;y<232;y++)for(let x=18;x<96;x++){const n=hash(x,y,8);if(n<frost*0.42)pix(x,y,n>0.32?16:15);if(frost>0.5&&n>0.975){pix(x,y,7);pix(x-2,y,16);pix(x+2,y,16);pix(x,y-2,16);pix(x,y+2,16)}}}
  for(const d of dust){const y=120+((d.p+lt*d.s)%100);pix(28+(d.x%48),(y|0),frost>0.5?16:6)}
  bed(112,196);

const NT={B1:61.74,D2:73.42,E2:82.41,'F#2':92.5,A2:110,B2:123.47,D3:146.83,E3:164.81,'F#3':185,A3:220,B3:246.94,D4:293.66,E4:329.63,'F#4':369.99,A4:440,B4:493.88,D5:587.33,E5:659.25,'F#5':739.99,A5:880,D6:1174.66,E6:1318.51,'F#6':1479.98,A6:1760};
function tone(ctx,dest,time,freq,dur,type,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,time);g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(vol,time+0.012);g.gain.exponentialRampToValueAtTime(vol*0.45,time+Math.min(0.18,dur*0.35));g.gain.exponentialRampToValueAtTime(0.0001,time+dur);o.connect(g);g.connect(dest);o.start(time);o.stop(time+dur+0.02)}
function blip(ctx,dest,time,freq){tone(ctx,dest,time,freq,0.07,'square',0.05)}
function buildMusic(ctx,t0){
  const sr=ctx.sampleRate,master=ctx.createGain();master.gain.setValueAtTime(0.72,t0);const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=3;master.connect(comp);comp.connect(ctx.destination);
  const duck=ctx.createGain();duck.connect(master);const iv=[];
  for(const c of TL.cues){const a=c.t-0.2,b=c.t+C[c.id].dur+0.35,l=iv[iv.length-1];if(l&&a<l[1]+0.8)l[1]=b;else iv.push([a,b])}
  duck.gain.setValueAtTime(1,t0);for(const[a,b]of iv){duck.gain.linearRampToValueAtTime(1,t0+Math.max(0,a-0.25));duck.gain.linearRampToValueAtTime(0.42,t0+a);duck.gain.setValueAtTime(0.42,t0+b);duck.gain.linearRampToValueAtTime(1,t0+b+0.55)}
  const delay=ctx.createDelay(1),fb=ctx.createGain(),dlp=ctx.createBiquadFilter(),wet=ctx.createGain();
  delay.delayTime.value=0.21;fb.gain.value=0.36;dlp.type='lowpass';dlp.frequency.value=2200;wet.gain.value=0.32;
  delay.connect(dlp);dlp.connect(fb);fb.connect(delay);dlp.connect(wet);wet.connect(duck);
  const dry=ctx.createGain();dry.gain.value=1;dry.connect(duck);const echoBus=ctx.createGain();echoBus.gain.value=0.8;echoBus.connect(delay);
  const end=t0+TL.DUR;wet.gain.setValueAtTime(0.32,end-2.6);wet.gain.linearRampToValueAtTime(0,end-1.1);fb.gain.setValueAtTime(0.36,end-2.6);fb.gain.linearRampToValueAtTime(0,end-1.4);master.gain.setValueAtTime(0.72,end-2.2);master.gain.linearRampToValueAtTime(0.0001,end-0.25);
  const roots=['D2','D2','B1','A2','D2','D2'];
  TL.S.forEach((s,i)=>{const step=0.7;for(let t=s.start;t<s.end-0.4&&t<TL.DUR-3;t+=step){const k=roots[i];tone(ctx,dry,t0+t,NT[k],step*0.95,'triangle',0.07);if(((t/step)|0)%2===0)tone(ctx,dry,t0+t,NT[k]*2,step*0.5,'triangle',0.03)}});
  const mel=[null,['A4','B4','A4','F#4','E4'],['F#4','A4','B4','A4','F#4'],['D5','B4','A4','B4','D5'],['B4','A4','F#4','E4','D4']];
  function charsAt(k){const c=C['p'+k],t=TL.at('p'+k);return[0,1,2,3,4].map(i=>t+c.dur*(0.05+i*0.17))}
  for(let k=1;k<=4;k++)charsAt(k).forEach((ct,i)=>{tone(ctx,echoBus,t0+ct,NT[mel[k][i]],0.42,'square',0.045);tone(ctx,dry,t0+ct,NT[mel[k][i]],0.42,'square',0.03)});
  const ds=[1,2,3,4].map(k=>C['p'+k].dur),sc=C.p5.dur/ds.reduce((a,b)=>a+b);let s=TL.at('p5');ds.forEach((d,k)=>{for(let i=0;i<5;i++){const ct=s+d*sc*(0.05+i*0.17);tone(ctx,echoBus,t0+ct,NT[mel[k+1][i]],0.36,'square',0.04)}s+=d*sc});
  const pent=['D4','E4','F#4','A4','B4','D5'];const r=rng(11);for(let t=6;t<TL.DUR-4;t+=0.7){if(Math.floor(t/0.7)%2)continue;const f=NT[pent[Math.floor(r()*pent.length)]];tone(ctx,echoBus,t0+t,f,0.28,'square',0.018)}
  const noiseLen=sr*2,nb=ctx.createBuffer(1,noiseLen,sr),nd=nb.getChannelData(0),nr=rng(5);for(let i=0;i<noiseLen;i++)nd[i]=nr()*2-1;
  for(let t=3.2;t<TL.DUR-3;t+=0.5){const src=ctx.createBufferSource(),g=ctx.createGain(),hp=ctx.createBiquadFilter();src.buffer=nb;src.loop=true;hp.type='highpass';hp.frequency.value=1800;g.gain.setValueAtTime(0.0001,t0+t);g.gain.exponentialRampToValueAtTime(t%1<0.1?0.05:0.025,t0+t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+t+0.05);src.connect(hp);hp.connect(g);g.connect(dry);src.start(t0+t);src.stop(t0+t+0.06)}
  TL.cues.forEach(c=>blip(ctx,dry,t0+c.t,c.id[0]==='p'?660:920));
  const fan=TL.at('p5')+C.p5.dur+0.05;['D5','F#5','A5','D6'].forEach((k,i)=>tone(ctx,echoBus,t0+fan+i*0.09,NT[k],0.4,'square',0.05));
  const br=t0+TL.at('p4')+0.15;const bs=ctx.createBufferSource(),bg=ctx.createGain(),bp=ctx.createBiquadFilter();bs.buffer=nb;bp.type='bandpass';bp.frequency.value=700;bp.Q.value=0.7;bg.gain.setValueAtTime(0.0001,br);bg.gain.exponentialRampToValueAtTime(0.04,br+0.08);bg.gain.exponentialRampToValueAtTime(0.0001,br+0.55);bs.connect(bp);bp.connect(bg);bg.connect(dry);bs.start(br);bs.stop(br+0.6);
  TL.S.slice(1).forEach(s=>{const src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain(),a=t0+s.start;src.buffer=nb;src.loop=true;bp.type='bandpass';bp.frequency.setValueAtTime(300,a);bp.frequency.exponentialRampToValueAtTime(1800,a+0.2);g.gain.setValueAtTime(0.0001,a);g.gain.exponentialRampToValueAtTime(0.08,a+0.08);g.gain.exponentialRampToValueAtTime(0.0001,a+0.28);src.connect(bp);bp.connect(g);g.connect(dry);src.start(a);src.stop(a+0.3)});
}
async function renderAudio(){const sr=44100,ctx=new OfflineAudioContext(2,Math.ceil(sr*TL.DUR),sr);buildMusic(ctx,0);const b=await ctx.startRendering();
  const n=b.length,buf=new ArrayBuffer(44+n*4),dv=new DataView(buf),ws=(o,s)=>[...s].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  const L=b.getChannelData(0),Rc=b.getChannelData(1);for(let i=0;i<n;i++){dv.setInt16(44+i*4,cl(L[i],-1,1)*32767,true);dv.setInt16(46+i*4,cl(Rc[i],-1,1)*32767,true)}
  let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

const ready=(async()=>{try{await Promise.race([Promise.all([document.fonts.load(`12px ${FONT}`,'静夜思唐李白床前明月光'),document.fonts.load('12px "Fusion Pixel 12px Mono latin"','SAVE')]),new Promise(r=>setTimeout(r,4000))])}catch(e){}await document.fonts.ready})();

if(!location.search.includes('render')){const ov=document.getElementById('overlay'),btn=document.getElementById('play'),prog=document.getElementById('prog');let ac=null,timers=[];
  async function loadVoice(ctx){try{return Object.fromEntries(await Promise.all(CLIPS.map(async c=>{const r=await fetch(`narration/${c.id}.wav`);if(!r.ok)throw 0;return[c.id,await ctx.decodeAudioData(await r.arrayBuffer())]})))}catch(e){return null}}
  function speak(c){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(C[c.id].text);u.lang='zh-CN';u.rate=c.id[0]==='p'?0.7:0.9;const v=speechSynthesis.getVoices().find(v=>/zh[-_]CN/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
  ready.then(()=>{renderFrame(TL.at('p5')+2.4);btn.disabled=false;btn.textContent='▶ 播放'});
  btn.onclick=async()=>{btn.disabled=true;if(ac)ac.close();timers.forEach(clearTimeout);timers=[];window.speechSynthesis&&speechSynthesis.cancel();ac=new AudioContext();await ac.resume();const voice=await loadVoice(ac);const t0=ac.currentTime+0.2;buildMusic(ac,t0);
    for(const c of TL.cues){if(voice){const s=ac.createBufferSource();s.buffer=voice[c.id];s.connect(ac.destination);s.start(t0+c.t)}else timers.push(setTimeout(()=>speak(c),(c.t+0.2)*1000))}
    ov.classList.add('hide');btn.disabled=false;
    const loop=()=>{const t=ac.currentTime-t0;if(t>=TL.DUR){renderFrame(TL.DUR-0.01);prog.style.width='100%';btn.textContent='↻ 重新播放';ov.classList.remove('hide');return}renderFrame(Math.max(0,t));prog.style.width=(Math.max(0,t)/TL.DUR*100)+'%';requestAnimationFrame(loop)};loop()}}
