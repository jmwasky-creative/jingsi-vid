<!doctype html>

<style>

<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>

</div>
<div id="bar"><div id="prog"></div></div>
<footer>《静夜思》 唐 · 李白 —— 古诗动画</footer>
<script>
const W=1920,H=1080,BAR=92,TR=1.8;
const main=document.getElementById('c'),M0=main.getContext('2d');let g=M0;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const bufA=mk(W,H),bufB=mk(W,H),bufC=mk(W,H),maskC=mk(W,H),blS=mk(480,270),blT=mk(120,68);
const FONT='"Ma Shan Zheng","Ma Shan Zheng Local","STKaiti","KaiTi","Kaiti SC",serif';
const SANS='"PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Micro Hei",sans-serif';
const LINES=['床前明月光','疑是地上霜','举头望明月','低头思故乡'];
const CLIPS=/*CLIPS*/[{"id":"c0","text":"公元七二六年，深秋。扬州城外的一间旅舍里，二十六岁的李白，独在异乡，夜不能寐。","dur":7.776},{"id":"p1","text":"床前明月光。","dur":2.445},{"id":"n1","text":"月光穿过窗棂，悄无声息地，铺满了床前。","dur":4.704},{"id":"p2","text":"疑是地上霜。","dur":1.834},{"id":"n2","text":"那一片清辉，白得发冷。恍惚之间，他竟以为，是地上结了一层秋霜。","dur":6.553},{"id":"p3","text":"举头望明月。","dur":2.032},{"id":"n3","text":"他抬起头。一轮明月，高悬天际。千里之外的故乡，此刻，也被这同一轮月光照着。","dur":8.453},{"id":"p4","text":"低头思故乡。","dur":1.901},{"id":"n4","text":"低下头，思绪便飞回了故乡。那里的炊烟，那里的灯火，还有那些，等他回家的人。","dur":7.765},{"id":"p5","text":"床前明月光，疑是地上霜。举头望明月，低头思故乡。","dur":8.653},{"id":"n5","text":"二十个字，一轮明月，照亮了一千三百年的乡愁。","dur":5.189}]/*END*/;
const C=Object.fromEntries(CLIPS.map(c=>[c.id,c]));
const LEAD=[0,0.6,0.6,1.8,3.6];

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ss=(a,b,t)=>{t=cl((t-a)/(b-a));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const L2=(p,q,t)=>[lerp(p[0],q[0],t),lerp(p[1],q[1],t)];
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o=5){let v=0,a=0.5,f=1;for(let i=0;i<o;i++){v+=a*vnoise(x*f,y*f,s+i*17);f*=2;a*=0.5}return v/(1-Math.pow(0.5,o))}
function ridge(base,amp,seed,oct){const r=rng(seed),ph=[...Array(oct)].map(()=>r()*100),pts=[];for(let i=0;i<=120;i++){const x=i/120;let y=0;for(let o=0;o<oct;o++)y+=Math.sin(x*(2.2+o*3.7)+ph[o])/(o+1)**1.1;pts.push([x*W*1.1-W*0.05,base-amp*(y+1.2)])}return pts}

const TL=(()=>{const S=[{start:0}],cues=[{id:'c0',t:2.8}];let end=2.8+C.c0.dur+1.4;S[0].end=end;
  for(let k=1;k<=4;k++){const st=end-TR,pt=st+TR+LEAD[k];cues.push({id:'p'+k,t:pt});const nt=pt+C['p'+k].dur+0.6;cues.push({id:'n'+k,t:nt});end=nt+C['n'+k].dur+1.6;S.push({start:st,end})}
  const st=end-TR,p5=st+TR+2.6;cues.push({id:'p5',t:p5});const n5=p5+C.p5.dur+1.2;cues.push({id:'n5',t:n5});end=n5+C.n5.dur+4;S.push({start:st,end});
  return{S,cues,DUR:end,at:id=>cues.find(c=>c.id===id).t}})();
function charsAt(k){const c=C['p'+k],t=TL.at('p'+k);return[0,1,2,3,4].map(i=>t+c.dur*(0.05+i*0.17))}
function p5chars(){const ds=[1,2,3,4].map(k=>C['p'+k].dur),sc=C.p5.dur/ds.reduce((a,b)=>a+b),out=[];let s=TL.at('p5');ds.forEach(d=>{for(let i=0;i<5;i++)out.push(s+d*sc*(0.05+i*0.17));s+=d*sc});return out}

const R=rng(7);
const stars=Array.from({length:240},()=>({x:R()*W,y:R()*H*0.6,r:R()*1.7+0.4,p:R()*6.28,s:R()*2+0.4}));
const motes=Array.from({length:70},()=>({x:R()*W,y:R()*H,v:R()*16+5,a:R()*6.28,r:R()*2+0.6}));
const grain=(()=>{const c=mk(256,256),x=c.getContext('2d'),im=x.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=R()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);return M0.createPattern(c,'repeat')})();
const moonTex=(()=>{const S=512,c=mk(S,S),x=c.getContext('2d'),im=x.createImageData(S,S),d=im.data;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const dx=(i-S/2)/(S/2),dy=(j-S/2)/(S/2),r2=dx*dx+dy*dy,o=(j*S+i)*4;if(r2>1){d[o+3]=0;continue}
    const n=fbm(i*0.007,j*0.007,5,6),m=ss(0.46,0.63,n),fine=fbm(i*0.05,j*0.05,9,3),limb=1-0.32*Math.pow(r2,1.5),v=(1-0.21*m)*(0.93+0.09*fine)*limb;
    d[o]=255*v;d[o+1]=247*v;d[o+2]=226*v*(1-0.04*m);d[o+3]=255*cl((1-Math.sqrt(r2))*S*0.5)}
  x.putImageData(im,0,0);const r=rng(5);for(let k=0;k<30;k++){const a=r()*6.283,dd=Math.sqrt(r())*0.82*S/2,cx=S/2+Math.cos(a)*dd,cy=S/2+Math.sin(a)*dd,cr=r()*13+3;x.fillStyle='rgba(120,110,95,.16)';x.beginPath();x.arc(cx,cy,cr,0,6.283);x.fill();x.strokeStyle='rgba(255,255,245,.2)';x.lineWidth=1.2;x.beginPath();x.arc(cx-0.6,cy-0.6,cr,3.6,5.8);x.stroke()}return c})();
const paper=(()=>{const w=960,h=540,c=mk(w,h),x=c.getContext('2d'),im=x.createImageData(w,h),d=im.data;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const v=0.93+0.06*fbm(i*0.01,j*0.01,31,4)+0.025*vnoise(i*0.9,j*0.07,41),o=(j*w+i)*4;d[o]=242*v;d[o+1]=233*v;d[o+2]=212*v;d[o+3]=255}
  x.putImageData(im,0,0);const vg=x.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,w*0.62);vg.addColorStop(0,'rgba(120,80,40,0)');vg.addColorStop(1,'rgba(120,80,40,.32)');x.fillStyle=vg;x.fillRect(0,0,w,h);return c})();
const planks=(()=>{const w=1100,h=640,c=mk(w,h),x=c.getContext('2d'),im=x.createImageData(w,h),d=im.data,ph=46;for(let j=0;j<h;j++){const k=Math.floor(j/ph),jj=j%ph,off=(k*137)%w;for(let i=0;i<w;i++){const gn=fbm((i+off)*0.004,j*0.09,k+3,4),ring=0.5+0.5*Math.sin((i+off)*0.01+gn*12);let v=0.5+0.3*gn+0.12*ring;if(jj<2)v*=0.3;if((i+off+k*311)%520<2)v*=0.4;const o=(j*w+i)*4;d[o]=46*v;d[o+1]=40*v;d[o+2]=44*v;d[o+3]=255}}x.putImageData(im,0,0);return c})();
const sky3=(()=>{const w=W,h=1800,c=mk(w,h),x=c.getContext('2d'),r=rng(77),bx=s=>[lerp(-0.1*w,1.1*w,s),lerp(0.95*h,0.05*h,s)],cols=['120,140,255','190,150,255','255,210,170','150,200,255'];
  x.globalCompositeOperation='lighter';for(let k=0;k<220;k++){const[px,py]=bx(r()),off=(r()-0.5)*260*(r()+0.3),nx=px+off*0.6,ny=py+off*0.8,rad=60+r()*180,gr=x.createRadialGradient(nx,ny,0,nx,ny,rad);gr.addColorStop(0,`rgba(${cols[k%4]},0.05)`);gr.addColorStop(1,`rgba(${cols[k%4]},0)`);x.fillStyle=gr;x.fillRect(nx-rad,ny-rad,rad*2,rad*2)}
  for(let k=0;k<7000;k++){let px,py;if(k<4500){const[a,b]=bx(r()),g1=(r()+r()+r()-1.5)*220;px=a+g1*0.6;py=b+g1*0.8}else{px=r()*w;py=r()*h}const rr=r()<0.97?r()*0.9+0.3:r()*1.6+1;x.fillStyle=`rgba(255,250,240,${0.3+r()*0.7})`;x.fillRect(px,py,rr,rr)}
  x.globalCompositeOperation='source-over';for(let k=0;k<60;k++){const[a,b]=bx(r()),rad=40+r()*70,gr=x.createRadialGradient(a,b,0,a,b,rad);gr.addColorStop(0,'rgba(2,4,12,0.35)');gr.addColorStop(1,'rgba(2,4,12,0)');x.fillStyle=gr;x.fillRect(a-rad,b-rad,rad*2,rad*2)}return c})();

function glow(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}
function poly(pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}
function dust(lt,col,amt=1){if(amt<=0)return;g.save();g.globalCompositeOperation='lighter';for(const m of motes){const y=((m.y-lt*m.v)%H+H)%H,x=m.x+Math.sin(lt*0.4+m.a)*40;g.fillStyle=`rgba(${col},${(0.25+0.25*Math.sin(lt*1.3+m.a))*amt})`;g.beginPath();g.arc(x,y,m.r,0,6.283);g.fill()}g.restore()}
function glyph(ch,x,y,size,a,blur,sc,gc='170,195,255'){if(a<=0.005||!ch)return;g.save();g.globalAlpha=a;g.translate(x,y);g.scale(sc,sc);if(blur>0.3)g.filter=`blur(${blur}px)`;g.font=`${size}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.shadowColor=`rgba(${gc},.9)`;g.shadowBlur=size*0.4;g.fillStyle='#fbf6e8';g.fillText(ch,0,0);g.restore()}
function poemV(k,x,y0,t,gc){const ts=charsAt(k);LINES[k-1].split('').forEach((ch,i)=>{const p=ss(ts[i],ts[i]+0.7,t);glyph(ch,x,y0+i*116,92,p,(1-p)*16,1+(1-p)*0.35,gc)})}

/* 序：水墨月出 */
const inkC=Array.from({length:26},(_,i)=>({x:W*(0.15+R()*0.7),y:H*(0.2+R()*0.6),r:200+R()*380,t:R()*5,c:['70,90,170','120,90,180','40,70,140','160,135,90'][i%4]}));
function S0(t,lt){g.fillStyle='#03050b';g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='lighter';for(const c of inkC){const q=ss(c.t,c.t+5,lt);if(q>0)glow(c.x+Math.sin(lt*0.2+c.r)*30,c.y,c.r*(0.25+0.75*q)+lt*8,c.c,0.055*q)}g.restore();
  const mx=W/2,my=H*0.40,mr=150,ring=ss(0.8,3.2,lt),fill=ss(2.6,5,lt);
  if(ring>0){g.save();g.strokeStyle='rgba(255,240,210,.9)';g.lineWidth=2.5;g.shadowColor='#ffe6be';g.shadowBlur=30;g.beginPath();g.arc(mx,my,mr,-Math.PI/2,-Math.PI/2+ring*6.283);g.stroke();g.restore()}
  if(fill>0){g.save();g.globalAlpha=fill;g.globalCompositeOperation='lighter';glow(mx,my,mr*5,'255,236,200',0.2);g.globalCompositeOperation='source-over';g.drawImage(moonTex,mx-mr,my-mr,mr*2,mr*2);g.restore()}
  '静夜思'.split('').forEach((ch,i)=>{const p=ss(1.6+i*0.45,2.4+i*0.45,lt);glyph(ch,W/2+(i-1)*170,H*0.71,130,p,(1-p)*18,1+(1-p)*0.4,'255,215,160')});
  ['唐','·','李','白'].forEach((ch,i)=>{const p=ss(3.6+i*0.2,4.3+i*0.2,lt);glyph(ch,W/2+(i-1.5)*58,H*0.80,40,p*0.85,(1-p)*10,1,'255,215,160')});
  dust(lt,'255,220,160')}

/* 一：床前明月光 */
const WIN={x:0.14*W,y:0.15*H,w:0.27*W,h:0.40*H},FQ={tl:[0.37*W,0.97*H],tr:[0.69*W,0.97*H],bl:[0.26*W,0.635*H],br:[0.49*W,0.635*H]},COLS=5,ROWS=6,BF=0.14;
const winP=(u,v)=>[WIN.x+u*WIN.w,WIN.y+v*WIN.h],flP=(u,v)=>L2(L2(FQ.tl,FQ.tr,u),L2(FQ.bl,FQ.br,u),v);
const beamM=Array.from({length:110},()=>({u:R(),v:R(),s:R(),p:R()*6.28,r:R()*1.8+0.5}));
function cells(P,fill){for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++){const u0=(i+BF/2)/COLS,u1=(i+1-BF/2)/COLS,v0=(j+BF/2)/ROWS,v1=(j+1-BF/2)/ROWS;g.fillStyle=fill;poly([P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)]);g.fill()}}
function branch(x,y,lt){const s=Math.sin(lt*0.8)*4;g.strokeStyle='#04060c';g.lineCap='round';g.lineWidth=9;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+150,y+40+s,x+300,y+20+s);g.stroke();g.lineWidth=5;g.beginPath();g.moveTo(x+140,y+35+s);g.quadraticCurveTo(x+200,y-30+s,x+250,y-70+s);g.moveTo(x+220,y+30+s);g.quadraticCurveTo(x+280,y+80+s,x+340,y+90+s);g.stroke();g.fillStyle='#04060c';[[300,20],[250,-70],[340,90],[200,-20],[120,30],[272,-40]].forEach(([dx,dy])=>{g.beginPath();g.arc(x+dx,y+dy+s,9,0,6.283);g.fill()})}
function drape(x,y,w,h,sw,dir){const gr=g.createLinearGradient(x,0,x+w*dir,0);gr.addColorStop(0,'#151c36');gr.addColorStop(1,'#080b16');g.fillStyle=gr;g.beginPath();g.moveTo(x,y);g.lineTo(x+w*dir,y);g.bezierCurveTo(x+w*0.4*dir+sw*0.3,y+h*0.35,x+w*0.25*dir+sw*0.6,y+h*0.5,x+w*0.6*dir+sw,y+h);g.lineTo(x+sw*0.4,y+h);g.closePath();g.fill();
  g.strokeStyle='rgba(140,160,220,.16)';g.lineWidth=2;for(let k=1;k<4;k++){g.beginPath();g.moveTo(x+w*dir*k/4,y);g.quadraticCurveTo(x+w*dir*k/6+sw*0.5,y+h*0.5,x+w*0.6*dir*k/4+sw,y+h);g.stroke()}}
function bed(lt){g.fillStyle='#070a14';g.fillRect(W*0.655,H*0.19,16,H*0.62);g.fillRect(W*0.985,H*0.19,18,H*0.62);g.fillRect(W*0.64,H*0.185,W*0.37,H*0.03);
  g.fillStyle='#0b1020';poly([[W*0.66,H*0.655],[W*1.02,H*0.655],[W*1.02,H*0.70],[W*0.645,H*0.70]]);g.fill();g.fillStyle='#070a14';g.fillRect(W*0.645,H*0.70,W*0.38,H*0.10);
  g.fillStyle='#10162a';g.beginPath();g.moveTo(W*0.70,H*0.66);g.bezierCurveTo(W*0.75,H*0.60,W*0.90,H*0.61,W*1.02,H*0.63);g.lineTo(W*1.02,H*0.69);g.lineTo(W*0.68,H*0.69);g.fill();
  const sw=Math.sin(lt*0.9)*10;drape(W*0.668,H*0.215,W*0.09,H*0.47,sw,1);drape(W*0.985,H*0.215,W*0.07,H*0.47,-sw*0.8,-1);
  g.strokeStyle='rgba(150,170,230,.28)';g.lineWidth=2;g.beginPath();g.moveTo(W*0.645,H*0.70);g.lineTo(W*1.02,H*0.70);g.stroke()}
function lamp(lt){g.fillStyle='#03040a';g.fillRect(W*0.02,H*0.83,W*0.16,H*0.025);g.fillRect(W*0.03,H*0.85,14,H*0.15);g.fillRect(W*0.165,H*0.85,14,H*0.15);const x=W*0.10,y=H*0.83;g.beginPath();g.ellipse(x,y-20,34,12,0,0,6.283);g.fill();g.fillRect(x-6,y-32,12,14);
  g.save();g.globalCompositeOperation='lighter';for(let i=0;i<46;i++){const yy=y-38-i*9,xx=x+Math.sin(i*0.22-lt*1.4)*i*0.7+Math.sin(i*0.07+lt*0.3)*i*0.4;g.fillStyle=`rgba(170,180,215,${0.13*(1-i/46)})`;g.beginPath();g.arc(xx,yy,2+i*0.18,0,6.283);g.fill()}g.restore()}
function S1(t,lt,D){const q=lt/D,sc=1.03+0.07*q;g.save();g.translate(W*0.42,H*0.62);g.scale(sc,sc);g.translate(-W*0.42-q*30,-H*0.62);
  let gr=g.createLinearGradient(0,0,0,H*0.62);gr.addColorStop(0,'#05070e');gr.addColorStop(1,'#0b1020');g.fillStyle=gr;g.fillRect(-200,-200,W+400,H*0.62+200);

  if(lt<0.95){const dp=ss(0.2,0.9,lt);glow(W/2,lerp(-40,H*0.62,dp*dp),18,'255,245,225',0.9)}g.restore()}
function ripples(lt){g.save();g.globalCompositeOperation='lighter';for(let k=0;k<6;k++){const age=lt-0.95-k*0.28,a=cl(0.6-age*0.16);if(age<=0||a<=0)continue;const r=age*480;g.strokeStyle=`rgba(255,240,210,${a})`;g.lineWidth=3;g.beginPath();g.ellipse(W/2,H*0.62,r,r*0.3,0,0,6.283);g.stroke()}g.restore()}
function S4(t,lt){const rv=ss(1.0,3.6,lt);if(rv<1)water4(lt);
  if(rv>=1)home(lt);else if(rv>0){const old=g;g=bufC.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';home(lt);g.globalCompositeOperation='destination-in';g.save();g.translate(W/2,H*0.62);g.scale(1,0.6);const R0=rv*2600,gr=g.createRadialGradient(0,0,R0*0.7,0,0,R0+1);gr.addColorStop(0,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(-W*2,-H*3,W*4,H*6);g.restore();g.globalCompositeOperation='source-over';g=old;g.drawImage(bufC,0,0)}
  if(lt<5)ripples(lt);poemV(4,W*0.86,H*0.21,t,'255,200,140')}

/* 合：宣纸题诗 */
const COLX=[0.83,0.765,0.68,0.59,0.50,0.41];
function inkChar(ch,x,y,size,p){if(p<=0||!ch)return;g.save();g.font=`${size}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.beginPath();g.rect(x-size,y-size*0.6,size*2,size*1.2*p);g.clip();g.fillStyle='rgba(27,23,20,.92)';g.shadowColor='rgba(40,30,20,.35)';g.shadowBlur=5;g.fillText(ch,x,y);g.restore()}
function S5(t,lt){g.drawImage(paper,0,0,W,H);const ma=ss(0.5,3,lt),mx=W*0.2,my=H*0.33;
  g.save();g.globalAlpha=ma;g.globalCompositeOperation='multiply';let gr=g.createRadialGradient(mx,my,100,mx,my,175);gr.addColorStop(0,'rgba(150,140,130,0)');gr.addColorStop(0.3,'rgba(150,140,130,.5)');gr.addColorStop(1,'rgba(150,140,130,0)');g.fillStyle=gr;g.beginPath();g.arc(mx,my,175,0,6.283);g.fill();
  [[RG1,0.35,H*0.18],[RG2,0.55,H*0.24]].forEach(([pts,a,dy],k)=>{const mA=ss(0.3+k*0.6,2.8+k*0.6,lt)*a;gr=g.createLinearGradient(0,H*0.5+dy,0,H);gr.addColorStop(0,`rgba(60,58,62,${mA})`);gr.addColorStop(1,`rgba(60,58,62,${mA*0.2})`);g.fillStyle=gr;g.beginPath();g.moveTo(pts[0][0],H);for(const p of pts)g.lineTo(p[0],p[1]+dy);g.lineTo(pts[pts.length-1][0],H);g.fill()});g.restore();
  '静夜思'.split('').forEach((ch,i)=>inkChar(ch,W*COLX[0],H*0.21+i*150,120,ss(TR+0.3+i*0.5,TR+0.8+i*0.5,lt)));
  ['唐','','李','白'].forEach((ch,i)=>inkChar(ch,W*COLX[1],H*0.21+250+i*58,44,ss(TR+1.7+i*0.15,TR+2.1+i*0.15,lt)));
  p5chars().forEach((ct,i)=>inkChar(LINES[Math.floor(i/5)][i%5],W*COLX[2+Math.floor(i/5)],H*0.21+(i%5)*124,100,ss(ct,ct+0.45,t)));
  const st=TL.at('n5')+0.6,sa=ss(st,st+0.4,t);if(sa>0){const sc=1+0.5*(1-sa);g.save();g.globalAlpha=sa*0.9;g.globalCompositeOperation='multiply';g.translate(W*COLX[5],H*0.21+4*124+120);g.scale(sc,sc);g.rotate(-0.04);g.fillStyle='#b3261e';g.beginPath();g.roundRect(-46,-46,92,92,8);g.fill();g.restore();
    g.save();g.globalAlpha=sa;g.translate(W*COLX[5],H*0.21+4*124+120);g.scale(sc,sc);g.rotate(-0.04);g.strokeStyle='#f1dcc6';g.lineWidth=3;g.strokeRect(-38,-38,76,76);g.fillStyle='#f4e3cf';g.font=`40px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText('李',0,-17);g.fillText('白',0,19);g.restore()}}

const SC=[S0,S1,S2,S3,S4,S5],TT=[null,'ink','zoom','tilt','ink','flash'];
const blobs=Array.from({length:80},()=>({x:R()*W,y:R()*H,r:R()*0.6+0.4,d:R()*0.55}));
function inkMask(p){const m=maskC.getContext('2d');m.setTransform(1,0,0,1,0,0);m.clearRect(0,0,W,H);m.filter='blur(18px)';m.fillStyle='#000';for(const b of blobs){const q=cl((p-b.d)/(1-b.d));if(q<=0)continue;m.beginPath();m.arc(b.x,b.y,q*q*(3-2*q)*b.r*720,0,6.283);m.fill()}m.filter='none';if(p>0.7){m.globalAlpha=(p-0.7)/0.3;m.fillRect(0,0,W,H);m.globalAlpha=1}}
function drawScene(i,ctx,t){const s=TL.S[i],old=g;g=ctx;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;SC[i](t,t-s.start,s.end-s.start);g=old}
function composite(type,p,m){const A=bufA,B=bufB;
  if(type==='ink'){m.drawImage(A,0,0);inkMask(p);const b=B.getContext('2d');b.globalCompositeOperation='destination-in';b.drawImage(maskC,0,0);b.globalCompositeOperation='source-over';m.save();m.globalAlpha=0.6*Math.sin(p*Math.PI);m.drawImage(maskC,-40,-40,W+80,H+80);m.restore();m.drawImage(B,0,0)}
  else if(type==='zoom'){m.save();const s=1+p*1.4;m.translate(W*0.48,H*0.80);m.scale(s,s);m.translate(-W*0.48,-H*0.80);m.drawImage(A,0,0);m.restore();m.save();m.globalAlpha=p;m.drawImage(B,0,0);m.restore()}
  else if(type==='tilt'){m.drawImage(A,0,p*H);m.drawImage(B,0,-(1-p)*H);m.save();m.globalAlpha=0.3*Math.sin(p*Math.PI);m.drawImage(B,0,-(1-p)*H-60);m.drawImage(A,0,p*H+60);m.restore()}
  else{m.drawImage(p<0.5?A:B,0,0);m.fillStyle=`rgba(255,248,235,${p<0.5?p*2:2-p*2})`;m.fillRect(0,0,W,H)}}
function sceneAt(t){let i=0;while(i<TL.S.length-1&&t>=TL.S[i+1].start)i++;return i}
function subtitles(t,m){for(const c of TL.cues){if(c.id[0]==='p')continue;const d=C[c.id].dur,a=ss(c.t-0.2,c.t+0.3,t)*(1-ss(c.t+d+0.2,c.t+d+0.7,t));if(a<=0)continue;m.save();m.globalAlpha=a;m.font=`36px ${SANS}`;m.textAlign='center';m.textBaseline='middle';m.fillStyle='#efe8d6';m.fillText(C[c.id].text,W/2,H-BAR/2);m.restore()}}
function renderFrame(t){const m=M0,i=sceneAt(t),S=TL.S;m.setTransform(1,0,0,1,0,0);m.globalAlpha=1;m.globalCompositeOperation='source-over';m.filter='none';
  if(i>0&&t<S[i].start+TR){const p=(t-S[i].start)/TR;drawScene(i-1,bufA.getContext('2d'),t);drawScene(i,bufB.getContext('2d'),t);composite(TT[i],p*p*(3-2*p),m)}else{drawScene(i,bufA.getContext('2d'),t);m.drawImage(bufA,0,0)}
  const s=blS.getContext('2d'),ti=blT.getContext('2d');s.drawImage(main,0,0,480,270);ti.drawImage(blS,0,0,120,68);const bs=i===5?0.1:0.32;
  m.save();m.globalCompositeOperation='screen';m.globalAlpha=bs;m.drawImage(blT,0,0,W,H);m.globalAlpha=bs*0.6;m.drawImage(blS,0,0,W,H);m.restore();
  const v=m.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*1.0);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');m.fillStyle=v;m.fillRect(0,0,W,H);
  m.save();m.globalAlpha=0.06;m.globalCompositeOperation='overlay';const fr=Math.floor(t*24);m.translate(-((fr*97)%256),-((fr*57)%256));m.fillStyle=grain;m.fillRect(0,0,W+256,H+256);m.restore();
  const bh=BAR*ss(0.2,2.0,t);m.fillStyle='#000';m.fillRect(0,0,W,bh);m.fillRect(0,H-bh,W,bh);subtitles(t,m);
  const f=ss(0,1.5,t)*(1-ss(TL.DUR-2.5,TL.DUR,t));if(f<1){m.fillStyle=`rgba(0,0,0,${1-f})`;m.fillRect(0,0,W,H)}}

const NT={B1:61.74,D2:73.42,E2:82.41,'F#2':92.5,A2:110,B2:123.47,D3:146.83,E3:164.81,'F#3':185,A3:220,B3:246.94,D4:293.66,E4:329.63,'F#4':369.99,A4:440,B4:493.88,D5:587.33,E5:659.25,D6:1174.66,E6:1318.51,'F#6':1479.98,A6:1760,B6:1975.53};
function score(){const n=[],p=(t,k,v,d,type='pluck')=>n.push({t,f:NT[k],v,d,type}),mel=[null,['A4','B4','A4','F#4','E4'],['F#4','A4','B4','A4','F#4'],['D5','B4','A4','B4','D5'],['B4','A4','F#4','E4','D4']];
  for(let k=1;k<=4;k++)charsAt(k).forEach((ct,i)=>p(ct,mel[k][i],0.5,3));p5chars().forEach((ct,i)=>p(ct,mel[1+Math.floor(i/5)][i%5],0.38,3.2));
  [[1.0,'A3'],[1.8,'D4'],[2.6,'E4'],[3.4,'A4'],[4.6,'F#4']].forEach(([t,k])=>p(t,k,0.35,3.5));
  const r=rng(123),pent=['D4','E4','F#4','A4','B4','D5','A3','B3'];for(let t=5;t<TL.DUR-5;t+=1.5+r()*1.3){if(!n.some(x=>Math.abs(x.t-t)<0.6))p(t,pent[Math.floor(r()*pent.length)],0.16,3.5)}
  const s2=TL.S[2];for(let t=s2.start+2;t<s2.end-1;t+=0.6+r()*0.9)p(t,['D6','F#6','A6','B6','E6'][Math.floor(r()*5)],0.14,4,'bell');
  const e5=TL.at('p5')+C.p5.dur+0.3;['D3','A3','D4','F#4','A4'].forEach((k,i)=>p(e5+i*0.12,k,0.35,6));return n}
function buildMusic(ctx,t0){const sr=ctx.sampleRate,master=ctx.createGain();master.gain.value=0.75;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
  const duck=ctx.createGain();duck.connect(master);const iv=[];for(const c of TL.cues){const a=c.t-0.3,b=c.t+C[c.id].dur+0.4,l=iv[iv.length-1];if(l&&a<l[1]+1.2)l[1]=b;else iv.push([a,b])}
  duck.gain.setValueAtTime(1,t0);for(const[a,b]of iv){duck.gain.linearRampToValueAtTime(1,t0+a-0.5);duck.gain.linearRampToValueAtTime(0.5,t0+a);duck.gain.linearRampToValueAtTime(0.5,t0+b);duck.gain.linearRampToValueAtTime(1,t0+b+0.8)}
  const len=Math.floor(sr*4),ir=ctx.createBuffer(2,len,sr),rr=rng(99);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(rr()*2-1)*Math.pow(1-i/len,3)}
  const rev=ctx.createConvolver();rev.buffer=ir;const wet=ctx.createGain();wet.gain.value=0.45;rev.connect(wet);wet.connect(duck);const bus=ctx.createGain();bus.connect(duck);bus.connect(rev);
  const chords=[['D2','A2','D3'],['D2','A2','F#3'],['B1','F#2','B2','D3'],['E2','B2','E3'],['D2','A2','F#3','A3'],['D2','A2','D3','F#3']];
  TL.S.forEach((s,i)=>{const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(i===3?380:460,t0+s.start);if(i===3)lp.frequency.linearRampToValueAtTime(1500,t0+s.start+5);const pg=ctx.createGain();pg.gain.setValueAtTime(0,t0+s.start);pg.gain.linearRampToValueAtTime(0.05,t0+s.start+TR);pg.gain.setValueAtTime(0.05,t0+s.end-TR);pg.gain.linearRampToValueAtTime(0,t0+s.end);lp.connect(pg);pg.connect(bus);
    chords[i].forEach(k=>[1,1.004].forEach(dt=>{const o=ctx.createOscillator();o.type='triangle';o.frequency.value=NT[k]*dt;o.connect(lp);o.start(t0+s.start);o.stop(t0+s.end+0.1)}))});
  const nb=ctx.createBuffer(1,sr*2,sr),nd=nb.getChannelData(0),nr=rng(5);for(let i=0;i<nd.length;i++)nd[i]=nr()*2-1;
  TL.S.slice(1).forEach(s=>{const src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain(),a=t0+s.start;src.buffer=nb;src.loop=true;bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(200,a);bp.frequency.exponentialRampToValueAtTime(2400,a+TR*0.55);bp.frequency.exponentialRampToValueAtTime(300,a+TR*1.3);ng.gain.setValueAtTime(0.0001,a);ng.gain.exponentialRampToValueAtTime(0.22,a+TR*0.55);ng.gain.exponentialRampToValueAtTime(0.0001,a+TR*1.4);src.connect(bp);bp.connect(ng);ng.connect(bus);src.start(a);src.stop(a+TR*1.5)});
  [1.4,TL.at('n5')+0.6].forEach(tt=>{const a=t0+tt;[[73.42,0.22],[110,0.12],[196,0.06],[311,0.03]].forEach(([f,v])=>{const o=ctx.createOscillator(),og=ctx.createGain();o.frequency.value=f;og.gain.setValueAtTime(0.0001,a);og.gain.exponentialRampToValueAtTime(v,a+0.02);og.gain.exponentialRampToValueAtTime(0.0001,a+7);o.connect(og);og.connect(bus);o.start(a);o.stop(a+7.1)})});
  for(const n of score()){const s=t0+n.t,env=ctx.createGain(),flt=ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.setValueAtTime(n.type==='bell'?9000:5200,s);flt.frequency.exponentialRampToValueAtTime(900,s+n.d*0.6);
    env.gain.setValueAtTime(0.0001,s);env.gain.exponentialRampToValueAtTime(n.v*0.32,s+0.006);env.gain.exponentialRampToValueAtTime(n.v*0.12,s+0.35);env.gain.exponentialRampToValueAtTime(0.0001,s+n.d);env.connect(flt);flt.connect(bus);
    const parts=n.type==='bell'?[[1,0.6,'sine'],[2.76,0.2,'sine'],[1.003,0.4,'sine']]:[[1,1,'triangle'],[2,0.35,'sine'],[3,0.16,'sine'],[4.02,0.06,'sine']];
    parts.forEach(([h,a,ty])=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(n.f*h*(n.type==='bell'?1:1.012),s);o.frequency.exponentialRampToValueAtTime(n.f*h,s+0.08);og.gain.value=a;o.connect(og);og.connect(env);o.start(s);o.stop(s+n.d+0.05)})}}

async function renderAudio(){const sr=44100,ctx=new OfflineAudioContext(2,Math.ceil(sr*TL.DUR),sr);buildMusic(ctx,0);const b=await ctx.startRendering();
  const n=b.length,buf=new ArrayBuffer(44+n*4),dv=new DataView(buf),ws=(o,s)=>[...s].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  const L=b.getChannelData(0),Rc=b.getChannelData(1);for(let i=0;i<n;i++){dv.setInt16(44+i*4,cl(L[i],-1,1)*32767,true);dv.setInt16(46+i*4,cl(Rc[i],-1,1)*32767,true)}
  let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

const ready=(async()=>{try{await Promise.race([Promise.all([document.fonts.load(`100px "Ma Shan Zheng"`,'静夜思唐李白'+LINES.join('')),document.fonts.load(`100px "Ma Shan Zheng Local"`,'静')]),new Promise(r=>setTimeout(r,4000))])}catch(e){}await document.fonts.ready})();
window.renderFrame=renderFrame;window.renderAudio=renderAudio;window.ready=ready;window.TL=TL;

if(!location.search.includes('render')){const ov=document.getElementById('overlay'),btn=document.getElementById('play'),prog=document.getElementById('prog');let ac=null,timers=[];
  async function loadVoice(ctx){try{return Object.fromEntries(await Promise.all(CLIPS.map(async c=>{const r=await fetch(`narration/${c.id}.wav`);if(!r.ok)throw 0;return[c.id,await ctx.decodeAudioData(await r.arrayBuffer())]})))}catch(e){return null}}
  function speak(c){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(C[c.id].text);u.lang='zh-CN';u.rate=c.id[0]==='p'?0.7:0.9;const v=speechSynthesis.getVoices().find(v=>/zh[-_]CN/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
  ready.then(()=>{renderFrame(TL.at('n5')+3);btn.disabled=false;btn.textContent='▶ 播放'});
  btn.onclick=async()=>{btn.disabled=true;if(ac)ac.close();timers.forEach(clearTimeout);timers=[];window.speechSynthesis&&speechSynthesis.cancel();ac=new AudioContext();await ac.resume();const voice=await loadVoice(ac);const t0=ac.currentTime+0.2;buildMusic(ac,t0);
    for(const c of TL.cues){if(voice){const s=ac.createBufferSource();s.buffer=voice[c.id];s.connect(ac.destination);s.start(t0+c.t)}else timers.push(setTimeout(()=>speak(c),(c.t+0.2)*1000))}
    ov.classList.add('hide');btn.disabled=false;
    const loop=()=>{const t=ac.currentTime-t0;if(t>=TL.DUR){renderFrame(TL.DUR-0.01);prog.style.width='100%';btn.textContent='↻ 重新播放';ov.classList.remove('hide');return}renderFrame(Math.max(0,t));prog.style.width=(Math.max(0,t)/TL.DUR*100)+'%';requestAnimationFrame(loop)};loop()}}
