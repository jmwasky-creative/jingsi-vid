<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口播动效 · 五场景</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #07090c; color: #f4f6f8; font: 16px/1.5 "PingFang SC", "Noto Sans SC", sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
    h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px; }
    p { color: #a8b0b8; margin: 0 0 28px; }
    figure { margin: 0 0 36px; }
    img, video { width: min(420px, 100%); border-radius: 16px; display: block; background: #111; }
    figcaption { margin-top: 10px; }
    strong { font-weight: 600; }
    span { color: #a8b0b8; }
  </style>
</head>
<body>
  <main>
    <h1>基于口播画面的动效</h1>
    <p>人保持在视频上半部。字、要点和竖图都进到下沿。动效例子是真人连续帧，不是定格。</p>
    <figure>
      <img src="inflow.gif" alt="竖图从下方流入，文字随后出现">
      <figcaption><strong>动效</strong> <span>口播下沿空出，竖图从下面升上来，字落在左侧。</span></figcaption>
    </figure>
    <figure>
      <img src="01-person.png" alt="人物介绍">
      <figcaption><strong>01 人物介绍</strong> <span>名字，再跟学校。</span></figcaption>
    </figure>
    <figure>
      <img src="02-text.png" alt="文字介绍">
      <figcaption><strong>02 文字介绍</strong> <span>一句大字，关键词用青色。</span></figcaption>
    </figure>
    <figure>
      <img src="03-inflow.png" alt="画面流入">
      <figcaption><strong>03 画面流入</strong> <span>竖图停在右下，字停在左下。</span></figcaption>
    </figure>
    <figure>
      <img src="04-points.png" alt="要点介绍">
      <figcaption><strong>04 要点介绍</strong> <span>三条，编号在前。</span></figcaption>
    </figure>
    <figure>
      <img src="05-quote.png" alt="金句">
      <figcaption><strong>05 金句</strong> <span>两行，第二行用青色。</span></figcaption>
    </figure>
  </main>
</body>
</html>
