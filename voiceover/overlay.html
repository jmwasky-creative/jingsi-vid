<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voiceover Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background-color: #111820;
        background-image:
          linear-gradient(45deg, #17212b 25%, transparent 25%),
          linear-gradient(-45deg, #17212b 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #17212b 75%),
          linear-gradient(-45deg, transparent 75%, #17212b 75%);
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
        background-size: 32px 32px;
      }

      canvas {
        display: block;
        width: min(100vw, calc(100vh * 0.5625));
        height: min(100vh, calc(100vw * 1.7777778));
      }

      body.render {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1080" height="1920" aria-label="旁白信息叠加层"></canvas>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
